<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101114" />
  <title>Bike Store</title>
  <!-- Tema guardado (bikestore_tema), aplicado antes de pintar para no mostrar un destello del otro tema.
       TemaContext lo mantiene actualizado después. Oscuro por defecto. -->
  <script>
    (function () {
      var tema = 'oscuro';
      try { if (localStorage.getItem('bikestore_tema') === 'claro') tema = 'claro'; } catch (e) {}
      document.documentElement.dataset.tema = tema;
      document.querySelector('meta[name="theme-color"]').content = tema === 'claro' ? '#f6f7f9' : '#101114';
    })();
  </script>
  <!-- Tipografía del sistema de diseño: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
